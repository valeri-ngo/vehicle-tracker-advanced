<nav aria-label="Main navigation">

    {% if user.is_authenticated %}
        <a href="{% url 'accounts:account-dashboard' %}">
            Dashboard
        </a>

        <a href="{% url 'vehicles:vehicle-list' %}">
            My Vehicles
        </a>

        <form
                method="post"
                action="{% url 'accounts:account-logout' %}"
        >
            {% csrf_token %}
            <button type="submit">Logout</button>
        </form>

    {% else %}
        <a href="{% url 'accounts:account-login' %}">
            Login
        </a>

        <a href="{% url 'accounts:account-register' %}">
            Register
        </a>
    {% endif %}

</nav>
