<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Add Odometer Entry</title>
    </head>
    <body>
        <h1>Add Odometer Entry</h1>
        {{ vehicle.brand }}
        {{ vehicle.model }}
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Save Mileage</button>
        </form>
        <a href="{% url "vehicles:vehicle-detail" vehicle.pk %}">Back to vehicle</a>
    </body>
</html>
