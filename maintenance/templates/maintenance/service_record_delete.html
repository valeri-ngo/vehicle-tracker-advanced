{% extends "base.html" %}

{% block content %}

    <h1>Delete Service Record</h1>
    <p>Do you want to delete {{ service_record.get_service_type_display }}?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Confirm Delete</button>
    </form>
    <a href="{% url 'maintenance:service-record-detail' service_record.pk %}">Cancel</a>

{% endblock %}
