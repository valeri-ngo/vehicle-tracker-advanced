{% extends "base.html" %}

{% block content %}
    <h1>Delete Maintenance Schedule</h1>

    <p>
        Are you sure you want to delete
        {{ maintenance_schedule.get_service_type_display }}?
    </p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Confirm Delete</button>
    </form>

    <a href="{% url 'maintenance:maintenance-schedule-detail' maintenance_schedule.pk %}">
        Cancel
    </a>
{% endblock %}
