{% extends "base.html" %}

{% block content %}
    <h1>Delete Vehicle Document</h1>

    <p>
        Are you sure you want to delete
        {{ document.get_document_type_display }}?
    </p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Confirm Delete</button>
    </form>

    <a href="{% url 'documents:vehicle-document-detail' document.pk %}">
        Cancel
    </a>
{% endblock %}
